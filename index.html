<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Activity — GET Request</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: Arial, sans-serif; background: #f2f5fa; color: #1e293b; }
    main { max-width: 760px; margin: 40px auto; padding: 32px; background: white; border-radius: 16px; }
    h1 { margin-top: 0; }
    p { line-height: 1.6; }
    a { color: #1d4ed8; overflow-wrap: anywhere; }
    button { padding: 12px 18px; border: 0; border-radius: 8px; background: #1d4ed8; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    a:focus-visible, button:focus-visible { outline: 3px solid #f59e0b; outline-offset: 4px; }
    pre { padding: 16px; border-radius: 8px; background: #0f172a; color: #e2e8f0; white-space: pre-wrap; overflow-wrap: anywhere; }
    footer { margin-top: 24px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>GitHub Activity</h1>
    <h2>Sample GET request</h2>
    <p>GET retrieves data from a server. This example retrieves post 1 from the free JSONPlaceholder API.</p>
    <p>
      Sample link:
      <a href="https://jsonplaceholder.typicode.com/posts/1" target="_blank" rel="noopener noreferrer">https://jsonplaceholder.typicode.com/posts/1</a>
    </p>
    <button id="send-request" type="button">Send GET request</button>
    <p id="status" role="status" aria-live="polite">Click the button to display the response.</p>
    <pre id="response" aria-label="JSON response">No request sent yet.</pre>
    <footer>
      <a href="https://github.com/C0mply/my_html_workbook.html">Source code on GitHub</a>
    </footer>
  </main>

  <script>
    const endpoint = 'https://jsonplaceholder.typicode.com/posts/1';
    const button = document.getElementById('send-request');
    const status = document.getElementById('status');
    const output = document.getElementById('response');

    button.addEventListener('click', async () => {
      button.disabled = true;
      status.textContent = 'Loading…';
      output.textContent = '';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);

      try {
        const response = await fetch(endpoint, {
          method: 'GET',
          headers: { Accept: 'application/json' },
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const post = await response.json();
        output.textContent = JSON.stringify(post, null, 2);
        status.textContent = `Success: HTTP ${response.status}`;
      } catch (error) {
        status.textContent = 'Request failed. Please try again.';
        output.textContent = error.name === 'AbortError'
          ? 'The request timed out after 10 seconds.'
          : error.message;
      } finally {
        clearTimeout(timeout);
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
